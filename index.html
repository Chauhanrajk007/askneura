<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0f19;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .video-card {
      width: 100%;
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 0 15px 1px rgba(99, 102, 241, 0.15);
      position: relative;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    video {
      width: 100%;
      max-height: 75vh;
      display: block;
      border-radius: 0.75rem;
      outline: none;
    }

    .info-bar {
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.875rem;
      color: #9ca3af;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.65rem;
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border-radius: 9999px;
      font-weight: 500;
      font-size: 0.75rem;
    }

    .badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
    }

    footer {
      font-size: 0.8rem;
      color: #6b7280;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Featured Video</h1>
      <p class="subtitle">High Quality Video & Audio Playback</p>
    </header>

    <div class="video-card">
      <div class="video-wrapper">
        <video controls playsinline preload="metadata">
          <source src="WhatsApp Video 2026-09-27 at 8.51.26 AM.mp4" type="video/mp4" />
          Your browser does not support HTML5 video tag.
        </video>
      </div>
      <div class="info-bar">
        <span>🎬 Video Stream with Audio</span>
        <span class="badge">Ready to Play</span>
      </div>
    </div>

    <footer>
      Hosted on Vercel
    </footer>
  </div>
</body>
</html>
