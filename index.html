<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Vertical Video Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: 'Inter', sans-serif;
      color: #fff;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer Wrapper */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }

    /* On Desktop: Sleek Phone-aspect Card */
    @media (min-width: 600px) {
      body {
        background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      }
      .app-container {
        max-width: 420px;
        height: 90vh;
        max-height: 860px;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                    0 0 40px 2px rgba(99, 102, 241, 0.25);
        overflow: hidden;
      }
    }

    /* Video Player Container */
    .video-box {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    /* On Mobile: Full height fill */
    @media (max-width: 599px) {
      video {
        object-fit: cover;
      }
    }

    /* Custom Floating Overlay for Quick Unmute/Sound & Controls */
    .overlay-controls {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 0;
      right: 0;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .badge-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.78rem;
      font-weight: 600;
      color: #fff;
    }

    .badge-live::before {
      content: '';
      width: 7px;
      height: 7px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    .sound-btn {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .sound-btn:active {
      transform: scale(0.92);
    }

    .sound-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Play/Pause Central Tap Indicator */
    .play-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.75);
      width: 72px;
      height: 72px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      pointer-events: none;
      z-index: 9;
    }

    .play-indicator.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .play-indicator svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    /* Bottom Info Bar */
    .bottom-info {
      position: absolute;
      bottom: env(safe-area-inset-bottom, 16px);
      left: 0;
      right: 0;
      padding: 2rem 1.25rem 1.25rem;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
      z-index: 10;
    }

    .bottom-info h2 {
      font-size: 1rem;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .bottom-info p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="video-box" id="videoBox">
      <!-- Standard Video Tag with Full Audio, PlaysInline for iOS/Android, and Standard Controls -->
      <video
        id="mainVideo"
        playsinline
        webkit-playsinline
        controls
        preload="auto"
      >
        <source src="WhatsApp Video 2026-09-27 at 8.51.26 AM.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>

      <!-- Top Overlay -->
      <div class="overlay-controls">
        <div class="badge-live">Full Audio & Video</div>
        <button class="sound-btn" id="soundToggle" aria-label="Toggle Mute">
          <svg id="soundIcon" viewBox="0 0 24 24">
            <!-- Unmuted icon by default -->
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </div>

      <!-- Center Play/Pause Pop Animation -->
      <div class="play-indicator" id="playIndicator">
        <svg id="indicatorIcon" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </div>

      <!-- Bottom Overlay Info -->
      <div class="bottom-info">
        <h2>Vertical Video Showcase</h2>
        <p>Tap screen to play / pause with sound</p>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('mainVideo');
    const soundToggle = document.getElementById('soundToggle');
    const soundIcon = document.getElementById('soundIcon');
    const playIndicator = document.getElementById('playIndicator');
    const indicatorIcon = document.getElementById('indicatorIcon');

    // Muted SVG Path
    const mutedPath = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.05 4.05L7 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
    // Unmuted SVG Path
    const unmutedPath = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';

    function updateSoundIcon() {
      if (video.muted || video.volume === 0) {
        soundIcon.innerHTML = mutedPath;
      } else {
        soundIcon.innerHTML = unmutedPath;
      }
    }

    soundToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      updateSoundIcon();
    });

    video.addEventListener('volumechange', updateSoundIcon);

    // Initial icon state
    updateSoundIcon();
  </script>
</body>
</html>
