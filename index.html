<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Cinema Showcase | Premium Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent: #38bdf8;
      --bg-dark: #05070c;
      --card-bg: rgba(13, 17, 28, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient Background Aura */
    .ambient-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(56, 189, 248, 0.08) 45%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: floatAura 12s ease-in-out infinite alternate;
    }

    @keyframes floatAura {
      0% { transform: translate(-30px, -20px) scale(0.9); }
      100% { transform: translate(30px, 20px) scale(1.1); }
    }

    /* Device / Player Shell */
    .player-shell {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }

    @media (min-width: 640px) {
      .player-shell {
        max-width: 430px;
        height: 88vh;
        max-height: 880px;
        border-radius: 36px;
        border: 1px solid var(--glass-border);
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9),
                    0 0 50px -10px var(--primary-glow),
                    inset 0 1px 1px rgba(255, 255, 255, 0.2);
        overflow: hidden;
        background: #000;
      }
    }

    /* Video Frame */
    .video-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* Top Premium Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 1.25rem 1.5rem;
      background: linear-gradient(180deg, rgba(5, 7, 12, 0.85) 0%, rgba(5, 7, 12, 0) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s ease;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
    }

    /* Sound Wave Visualizer Animation */
    .wave-bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 12px;
    }
    .wave-bar {
      width: 2.5px;
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
      animation: soundWave 1.2s ease-in-out infinite alternate;
    }
    .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 70%; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 90%; }
    .wave-bar:nth-child(4) { animation-delay: 0.1s; height: 50%; }

    .paused .wave-bar {
      animation-play-state: paused;
      height: 3px !important;
    }

    @keyframes soundWave {
      0% { height: 3px; }
      100% { height: 12px; }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.06);
    }
    .icon-btn:active {
      transform: scale(0.94);
    }
    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Tap feedback animations */
    .feedback-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      width: 80px;
      height: 80px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 15;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .feedback-icon.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .feedback-icon svg {
      width: 36px;
      height: 36px;
      fill: #fff;
    }

    /* Bottom Control Glass Panel */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 3rem 1.25rem calc(env(safe-area-inset-bottom, 16px) + 12px);
      background: linear-gradient(0deg, rgba(5, 7, 12, 0.95) 0%, rgba(5, 7, 12, 0.6) 60%, rgba(5, 7, 12, 0) 100%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 20;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s ease;
    }

    /* Video Title / Metadata */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .video-info h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.01em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6);
      margin-bottom: 2px;
    }

    .video-info p {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 6px #22c55e;
    }

    /* Luxury Progress Bar */
    .timeline-container {
      position: relative;
      width: 100%;
      height: 24px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .timeline-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.16);
      border-radius: 9999px;
      position: relative;
      overflow: hidden;
      transition: height 0.15s ease;
    }

    .timeline-container:hover .timeline-bg {
      height: 8px;
    }

    .timeline-buffered {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
    }

    .timeline-played {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #38bdf8);
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .timeline-handle {
      position: absolute;
      left: 0%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.6), 0 0 12px var(--accent);
      transition: transform 0.15s ease;
      pointer-events: none;
    }

    .timeline-container:hover .timeline-handle,
    .timeline-container.dragging .timeline-handle {
      transform: translate(-50%, -50%) scale(1);
    }

    /* Pro Control Actions Row */
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .left-controls, .right-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-display {
      font-size: 0.78rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #cbd5e1;
      letter-spacing: 0.02em;
    }

    .speed-btn {
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .speed-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* Hidden UI State for Cinematic Immersion */
    .hud-hidden .top-bar {
      opacity: 0;
      transform: translateY(-20px);
      pointer-events: none;
    }

    .hud-hidden .bottom-panel {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-50px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Quick Unmute Banner (When browser blocks autoplay audio) */
    .unmute-banner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 14px 24px;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7), 0 0 25px var(--primary-glow);
      z-index: 30;
      animation: pulseBanner 2s infinite ease-in-out;
      transition: opacity 0.3s, transform 0.3s;
    }

    @keyframes pulseBanner {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.04); }
    }

    .unmute-banner.hide {
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.9);
    }
  </style>
</head>
<body>

  <!-- Ambient background glow on desktop -->
  <div class="ambient-glow"></div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#22c55e"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    <span id="toastMsg">Link copied to clipboard!</span>
  </div>

  <div class="player-shell" id="playerShell">
    <div class="video-container" id="videoContainer">
      
      <!-- Video Element -->
      <video
        id="video"
        playsinline
        webkit-playsinline
        preload="auto"
        loop
      >
        <source src="WhatsApp Video 2026-09-27 at 8.51.26 AM.mp4" type="video/mp4" />
        Your browser does not support HTML5 video.
      </video>

      <!-- Center Feedback Animation (Play/Pause) -->
      <div class="feedback-icon" id="feedbackIcon">
        <svg id="feedbackSvg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </div>

      <!-- Unmute Prompt Banner -->
      <div class="unmute-banner hide" id="unmuteBanner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#38bdf8"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <span style="font-size: 0.88rem; font-weight: 700; color: #fff;">Tap to Unmute Audio</span>
      </div>

      <!-- Top Header Glass -->
      <div class="top-bar">
        <div class="brand-tag">
          <div class="wave-bars paused" id="soundWaves">
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
            <div class="wave-bar"></div>
          </div>
          <span>Ultra HD 4K</span>
        </div>

        <div class="top-actions">
          <button class="icon-btn" id="shareBtn" title="Share">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
          </button>
          <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
            <svg id="fsIcon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>

      <!-- Bottom Glass HUD -->
      <div class="bottom-panel">
        
        <!-- Video Title & Status -->
        <div class="meta-row">
          <div class="video-info">
            <h1>Featured Showcase</h1>
            <p><span class="live-dot"></span> Stereo Audio • Portrait Stream</p>
          </div>
        </div>

        <!-- Custom Scrubber Timeline -->
        <div class="timeline-container" id="timelineContainer">
          <div class="timeline-bg">
            <div class="timeline-buffered" id="timelineBuffered"></div>
            <div class="timeline-played" id="timelinePlayed"></div>
          </div>
          <div class="timeline-handle" id="timelineHandle"></div>
        </div>

        <!-- Action Controls -->
        <div class="controls-row">
          <div class="left-controls">
            <!-- Play / Pause Button -->
            <button class="icon-btn" id="playBtn" title="Play/Pause">
              <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
            
            <!-- Mute / Unmute Button -->
            <button class="icon-btn" id="soundBtn" title="Mute/Unmute">
              <svg id="soundIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>

            <!-- Time Display -->
            <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
          </div>

          <div class="right-controls">
            <!-- Speed Selector -->
            <button class="speed-btn" id="speedBtn">1.0x</button>
            
            <!-- Picture in Picture (PiP) -->
            <button class="icon-btn" id="pipBtn" title="Picture in Picture">
              <svg viewBox="0 0 24 24"><path d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"/></svg>
            </button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const playerShell = document.getElementById('playerShell');
    const videoContainer = document.getElementById('videoContainer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const soundBtn = document.getElementById('soundBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundWaves = document.getElementById('soundWaves');
    const timeDisplay = document.getElementById('timeDisplay');
    const timelineContainer = document.getElementById('timelineContainer');
    const timelinePlayed = document.getElementById('timelinePlayed');
    const timelineBuffered = document.getElementById('timelineBuffered');
    const timelineHandle = document.getElementById('timelineHandle');
    const feedbackIcon = document.getElementById('feedbackIcon');
    const feedbackSvg = document.getElementById('feedbackSvg');
    const speedBtn = document.getElementById('speedBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fsIcon = document.getElementById('fsIcon');
    const pipBtn = document.getElementById('pipBtn');
    const shareBtn = document.getElementById('shareBtn');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toastMsg');
    const unmuteBanner = document.getElementById('unmuteBanner');

    const SVGS = {
      play: '<path d="M8 5v14l11-7z"/>',
      pause: '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>',
      volumeHigh: '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>',
      volumeMuted: '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.05 4.05L7 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>',
      fullscreen: '<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>',
      exitFullscreen: '<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>'
    };

    let hideHudTimeout = null;
    let isDragging = false;

    // Format Seconds to MM:SS
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Toggle Play/Pause with central flash
    function togglePlay() {
      if (video.paused || video.ended) {
        video.play().then(() => {
          showFeedback('play');
        }).catch(() => {
          // Autoplay policy fallback
          video.muted = true;
          video.play();
          unmuteBanner.classList.remove('hide');
        });
      } else {
        video.pause();
        showFeedback('pause');
      }
    }

    function showFeedback(type) {
      feedbackSvg.innerHTML = type === 'play' ? SVGS.play : SVGS.pause;
      feedbackIcon.classList.remove('show');
      void feedbackIcon.offsetWidth; // trigger reflow
      feedbackIcon.classList.add('show');
      setTimeout(() => feedbackIcon.classList.remove('show'), 400);
    }

    // Update Play UI
    video.addEventListener('play', () => {
      playIcon.innerHTML = SVGS.pause;
      if (!video.muted) soundWaves.classList.remove('paused');
      resetHudTimer();
    });

    video.addEventListener('pause', () => {
      playIcon.innerHTML = SVGS.play;
      soundWaves.classList.add('paused');
      showHud();
    });

    // Sound toggle
    function toggleMute() {
      video.muted = !video.muted;
      updateSoundUI();
    }

    function updateSoundUI() {
      if (video.muted || video.volume === 0) {
        soundIcon.innerHTML = SVGS.volumeMuted;
        soundWaves.classList.add('paused');
      } else {
        soundIcon.innerHTML = SVGS.volumeHigh;
        if (!video.paused) soundWaves.classList.remove('paused');
        unmuteBanner.classList.add('hide');
      }
    }

    // Progress updates
    video.addEventListener('timeupdate', () => {
      if (!isDragging && video.duration) {
        const percent = (video.currentTime / video.duration) * 100;
        timelinePlayed.style.width = `${percent}%`;
        timelineHandle.style.left = `${percent}%`;
        timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
      }
    });

    video.addEventListener('progress', () => {
      if (video.buffered.length > 0 && video.duration) {
        const bufferedEnd = video.buffered.end(video.buffered.length - 1);
        const percent = (bufferedEnd / video.duration) * 100;
        timelineBuffered.style.width = `${percent}%`;
      }
    });

    video.addEventListener('loadedmetadata', () => {
      timeDisplay.textContent = `0:00 / ${formatTime(video.duration)}`;
    });

    // Timeline Scrubbing Logic
    function scrub(e) {
      const rect = timelineContainer.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      const clamped = Math.max(0, Math.min(1, pos));
      timelinePlayed.style.width = `${clamped * 100}%`;
      timelineHandle.style.left = `${clamped * 100}%`;
      if (video.duration) {
        video.currentTime = clamped * video.duration;
      }
    }

    timelineContainer.addEventListener('mousedown', (e) => {
      isDragging = true;
      timelineContainer.classList.add('dragging');
      scrub(e);
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) scrub(e);
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        timelineContainer.classList.remove('dragging');
      }
    });

    // Touch support for scrubber
    timelineContainer.addEventListener('touchstart', (e) => {
      isDragging = true;
      scrub(e.touches[0]);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (isDragging) scrub(e.touches[0]);
    }, { passive: true });

    window.addEventListener('touchend', () => {
      isDragging = false;
    });

    // Speed Cycle (1x -> 1.25x -> 1.5x -> 2x -> 0.5x)
    const speeds = [1.0, 1.25, 1.5, 2.0, 0.5];
    let currentSpeedIdx = 0;
    speedBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      const newSpeed = speeds[currentSpeedIdx];
      video.playbackRate = newSpeed;
      speedBtn.textContent = `${newSpeed}x`;
      showToast(`Playback speed: ${newSpeed}x`);
    });

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        if (playerShell.requestFullscreen) {
          playerShell.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen(); // iOS Safari native full screen
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fsIcon.innerHTML = SVGS.exitFullscreen;
      } else {
        fsIcon.innerHTML = SVGS.fullscreen;
      }
    });

    // Picture in Picture
    pipBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      try {
        if (video !== document.pictureInPictureElement) {
          await video.requestPictureInPicture();
        } else {
          await document.exitPictureInPicture();
        }
      } catch (err) {
        showToast('PiP not supported on this browser');
      }
    });

    // Share Button
    shareBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Featured Portrait Video',
            url: window.location.href,
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('Link copied to clipboard!');
      }
    });

    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // Auto-hide HUD on inactivity during playback
    function showHud() {
      playerShell.classList.remove('hud-hidden');
    }

    function resetHudTimer() {
      showHud();
      clearTimeout(hideHudTimeout);
      if (!video.paused) {
        hideHudTimeout = setTimeout(() => {
          playerShell.classList.add('hud-hidden');
        }, 3000);
      }
    }

    videoContainer.addEventListener('mousemove', resetHudTimer);
    videoContainer.addEventListener('click', (e) => {
      // If clicking inside HUD buttons or timeline, don't trigger center play
      if (e.target.closest('.bottom-panel') || e.target.closest('.top-bar') || e.target.closest('.unmute-banner')) {
        return;
      }
      togglePlay();
      resetHudTimer();
    });

    playBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePlay();
    });

    soundBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMute();
    });

    unmuteBanner.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = false;
      video.play();
      updateSoundUI();
    });

    fullscreenBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFullscreen();
    });

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'KeyM') {
        toggleMute();
      } else if (e.code === 'KeyF') {
        toggleFullscreen();
      } else if (e.code === 'ArrowRight') {
        video.currentTime = Math.min(video.duration, video.currentTime + 5);
      } else if (e.code === 'ArrowLeft') {
        video.currentTime = Math.max(0, video.currentTime - 5);
      }
      resetHudTimer();
    });

    // Attempt autoplay with sound on load; if browser blocks, fallback to muted + banner
    window.addEventListener('DOMContentLoaded', () => {
      updateSoundUI();
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          video.muted = true;
          updateSoundUI();
          video.play().catch(() => {});
          unmuteBanner.classList.remove('hide');
        });
      }
    });
  </script>
</body>
</html>
